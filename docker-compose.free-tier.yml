# ──────────────────────────────────────────────────────────────
# Docker Compose — Free-Tier Mode (No GPU)
# Uses HuggingFace API instead of local inference
# ──────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── FastAPI Backend (API fallback mode) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - INFERENCE_BACKEND=hf_api
      - HF_TOKEN=${HF_TOKEN}
      - SANDBOX_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Next.js Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
