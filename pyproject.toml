[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AMD AgentForge — Autonomous multi-agent application builder"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["backend"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
reportMissingImports = "warning"
